server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Reverse proxy to Go backend ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ── SSE-specific settings ────────────────────────────────────────────
        # Disable buffering so Server-Sent Events stream through immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 0;        # no timeout — SSE connections are long-lived
        proxy_send_timeout 0;
        proxy_connect_timeout 10s;

        # Forward the Connection header so keep-alive works end-to-end
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # ── React SPA fallback ───────────────────────────────────────────────────
    # All non-asset routes return index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
